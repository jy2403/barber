const BC = { tab: 'hoy' };
const citasDe = (d) => agendaDia(d).filter((c) => c.b === YO).sort((a, z) => a.ini - z.ini);
function citaCard(c, d) {
  const hoy = sameDay(d, HOY);
  const cerrada = !porAtender(c);
  const venta = VENTAS.find((v) => v.cliente === c.cliente && v.b === c.b);

  } else {
    acts = (hoy ? '<a class="btn btn-gold btn-sm" href="#/barbero/ventas?cita=' + c.id + '">' + I('receipt', 16) + (c.est === 'encurso' ? 'Terminar y registrar venta' : 'Atender y registrar venta') + '</a>' : '') +

      (hoy ? '<button type="button" class="btn btn-quiet btn-sm" data-act="bc-noshow" data-id="' + c.id + '">No asistió</button>' : '<button type="button" class="btn btn-quiet btn-sm" data-act="demo" data-msg="Recordatorio enviado a ' + esc(c.cliente) + '" data-icon="bell">Recordar</button>') + '</div>';
  }
  return '<article class="cita' + (c.est === 'encurso' ? ' is-now' : '') + (cerrada ? ' is-done' : '') + '"><div class="cita-time"><b>' + hora(c.ini) + '</b><small>' + c.dur + ' min</small></div>' +
    '<div class="cita-body"><div class="cita-name"><b>' + esc(c.cliente) + '</b>' + badge(EST_CITA[c.est].txt, EST_CITA[c.est].cls) + '</div><span>' + c.largo + ' · <strong>' + cop(c.precio) + '</strong></span>' +
    '<small>' + I('phone', 14) + c.tel + ' · ' + c.hist + '</small>' + (c.nota ? '<span class="quote">“' + esc(c.nota) + '”</span>' : '') + '</div>' +
    '<div class="cita-acts">' + acts + '</div></article>';

function bcView() {
  const hoy = citasDe(HOY);
  const man = addDays(HOY, 1);
  const lm = citasDe(man);
  const sem = [];
  for (let k = 1; k <= 7; k++) { const d = addDays(HOY, k); sem.push([d, citasDe(d)]); }
  const nSem = sem.reduce((s, x) => s + x[1].filter((c) => c.est !== 'cancelada').length, 0);
  const tabs = '<div class="seg" role="tablist" aria-label="Periodo">' + [['hoy', 'Hoy · ' + hoy.length], ['manana', 'Mañana · ' + lm.length], ['semana', 'Próximos 7 días · ' + nSem]].map((t) => '<button type="button" role="tab" data-act="bc-tab" data-v="' + t[0] + '" aria-selected="' + (BC.tab === t[0]) + '">' + t[1] + '</button>').join('') + '</div>';
  const kp = (l, v, c) => '<div class="mini-kpi"><span><i style="background:' + c + '"></i>' + l + '</span><b>' + v + '</b></div>';
  const count = (l, f) => l.filter(f).length;
  let kpis; let body;
  if (BC.tab === 'hoy') {
    kpis = kp('Citas de hoy', hoy.length, 'var(--gold)') + kp('Atendidas', count(hoy, (c) => c.est === 'atendida'), 'var(--ok)') + kp('Por atender', count(hoy, porAtender), 'var(--info)') + kp('No asistió', count(hoy, (c) => c.est === 'noasistio'), 'var(--bad)');
    body = '<section class="stack-v" aria-label="Citas de hoy"><h2 class="day-h">Hoy · ' + fLarga(HOY) + '</h2>' + (hoy.map((c) => citaCard(c, HOY)).join('') || '<div class="card ag-empty">No tienes citas hoy.</div>') + '</section>';
  } else if (BC.tab === 'manana') {
    const rs = rangosDe(BB(YO), man);
    const libre = rs.reduce((s, r) => s + r[1] - r[0], 0) - lm.reduce((s, c) => s + c.dur, 0);
    kpis = kp('Citas de mañana', lm.length, 'var(--gold)') + kp('Confirmadas', count(lm, (c) => c.est === 'confirmada'), 'var(--ok)') + kp('Sin confirmar', count(lm, (c) => c.est === 'pendiente'), 'var(--info)') + kp('Tiempo libre', rs.length ? durTxt(Math.max(0, libre)) : '—', 'var(--ink-4)');
    body = '<section class="stack-v" aria-label="Citas de mañana"><h2 class="day-h">Mañana · ' + fLarga(man) + (esFestivo(man) ? ' · festivo' : '') + '</h2>' +
      (lm.length ? lm.map((c) => citaCard(c, man)).join('') : '<div class="card ag-empty">' + (rs.length ? 'Aún no tienes citas para mañana.' : 'Mañana es tu día libre.') + '</div>') + '</section>';
  } else {
    const llenos = sem.filter((x) => BB(YO).lleno.indexOf(diffDays(x[0], HOY)) >= 0).length;
    const todas = [].concat.apply([], sem.map((x) => x[1]));
    kpis = kp('Próximos 7 días', nSem, 'var(--gold)') + kp('Confirmadas', count(todas, (c) => c.est === 'confirmada'), 'var(--ok)') + kp('Sin confirmar', count(todas, (c) => c.est === 'pendiente'), 'var(--info)') + kp('Días con agenda llena', llenos, 'var(--warn)');
    body = sem.map((x) => {
      const d = x[0]; const l = x[1];
      const off = diffDays(d, HOY);
      const lleno = BB(YO).lleno.indexOf(off) >= 0;
      const libre = !rangosDe(BB(YO), d).length;
      const tit = cap(fLarga(d)) + ' · ' + (libre ? 'día libre' : plural(l.length, 'cita', 'citas')) + (lleno ? ' · agenda llena' : '') + (esFestivo(d) ? ' · festivo' : '');
      return '<section class="stack-v" aria-label="' + esc(tit) + '"><h2 class="day-h">' + tit + '</h2>' + (libre ? '<div class="card ag-empty">No trabajas este día.</div>' : l.slice(0, 2).map((c) => citaCard(c, d)).join('') + (l.length > 2 ? '<p class="muted" style="font-size:13px">y ' + plural(l.length - 2, 'cita más', 'citas más') + ' ese día.</p>' : '')) + '</section>';
    }).join('');
  }
  return '<div class="ph"><div class="ph-text"><span class="ph-eyebrow">Hola, Santiago</span><h1 class="ph-title">Mis citas</h1></div><div class="ph-actions">' + tabs + '</div></div><div class="mini-kpis">' + kpis + '</div>' + body;
}

      '<section class="card card-pad" aria-label="Horario de trabajo">' + part('hz', () => HZ.view()) + '</section>' +
      '<section class="card card-pad" aria-labelledby="t-bloq"><div class="card-head"><div><h2 class="card-title" id="t-bloq">Bloqueos puntuales</h2><span class="card-sub">Para una diligencia o una cita médica. Vacaciones e incapacidades se solicitan al administrador.</span></div><button type="button" class="btn btn-dashed btn-sm" data-act="bp-add">' + I('plus', 16) + 'Bloquear un horario</button></div>' +
      part('bp-bloq', bpBloq) + '<p class="note" style="margin-top:14px">' + I('info', 18) + '<span>Si cambias tu horario o bloqueas horas en las que ya tienes citas, te mostramos cuáles son antes de guardar y el administrador recibe un aviso.</span></p></section>';
    return panel({ rol: 'barbero', active: 'perfil', content });
  },
  act: Object.assign({
    'bp-save': () => {
      const b = BB(YO);
      b.ofrece = Object.keys(BP.serv).filter((k) => BP.serv[k]);
      const dias = {};
      if (HZ.s.modo === 'semana') HZ.s.semana.forEach((on, i) => { if (on) dias[edToDow(i)] = HZ.s.franjas.map((f) => f.slice()); });
      else HZ.s.dias.forEach((d, i) => { if (d.on && d.r.length) dias[edToDow(i)] = d.r.map((f) => f.slice()); });
      b.dias = dias;
      Object.keys(AG_CACHE).forEach((k) => delete AG_CACHE[k]);
      toast('Perfil actualizado. El administrador recibe un aviso de los cambios.');
    },
    'bp-corr': () => openModal({ title: 'Pedir una corrección', size: 'sm', body: fld('Dato a corregir', sel(['Celular', 'Correo', 'Contacto de emergencia', 'Medio de pago de comisiones', 'Otro'])) + fld('¿Qué debe decir?', '<textarea class="textarea" rows="3" placeholder="Escribe el dato correcto"></textarea>'), foot: '<button type="button" class="btn btn-quiet" data-act="modal-close">Cancelar</button><button type="button" class="btn btn-gold" data-act="bp-ok" data-msg="Solicitud enviada al administrador">Enviar solicitud</button>' }),
    'bp-ok': (el) => { closeModal(); toast(el.dataset.msg); },
    'bp-add': () => openModal({ title: 'Bloquear un horario', size: 'sm',
      body: fld('Fecha', '<input class="input" type="date" id="bq-d" min="' + iso(HOY) + '" value="' + iso(addDays(HOY, 1)) + '">') + '<div class="fgrid-2">' + fld('Desde', '<select class="select" id="bq-a">' + opts(HORAS_OPC, 840) + '</select>') + fld('Hasta', '<select class="select" id="bq-z">' + opts(HORAS_OPC, 960) + '</select>') + '</div>' + fld('Motivo', sel(['Cita médica', 'Diligencia personal', 'Capacitación', 'Otro'], 'id="bq-m"')) + '<span class="field"><span class="err" id="bq-err"></span></span>',
      foot: '<button type="button" class="btn btn-quiet" data-act="modal-close">Cancelar</button><button type="button" class="btn btn-gold" data-act="bp-add-ok">Bloquear</button>' }),
    'bp-add-ok': () => {
      const d = fromIso(document.getElementById('bq-d').value); const a = +document.getElementById('bq-a').value; const z = +document.getElementById('bq-z').value;
      if (!d || z <= a) { document.getElementById('bq-err').textContent = !d ? 'Elige una fecha.' : 'La hora final debe ser posterior a la inicial.'; return; }
      BP.bloq.push({ d, a, z, m: document.getElementById('bq-m').value });
      closeModal(); refresh('bp-bloq'); toast('Horario bloqueado el ' + fDeMes(d));
    },
    'bp-del': (el) => { const x = BP.bloq.splice(+el.dataset.k, 1)[0]; refresh('bp-bloq'); toast('Bloqueo del ' + fDeMes(x.d) + ' eliminado'); }
  }, HZ.act),
  chg: Object.assign({ 'bp-serv': (el) => { BP.serv[el.value] = el.checked; } }, HZ.chg)
};

/* ---------- Mis ventas ---------- */
function bvTile() {
  const c = caja(YO);
  const com = c.total * NEGOCIO.comision;
  return '<h2 style="font-size:13px;font-weight:700;color:var(--gold-text)">Lo que llevas hoy</h2><span class="caja-total num" style="font-size:44px;display:block;margin:10px 0 8px">' + cop(com + c.propinas) + '</span>' +
    '<span style="font-size:13px;color:var(--ink-2)">Tu comisión (' + NEGOCIO.comision * 100 + ' %) más tus propinas, en ' + plural(c.servicios, 'servicio', 'servicios') + '.</span>' +
    '<div class="rows" style="margin-top:12px;border-top:1px solid var(--line-2)"><div class="kv"><span>Ventas netas</span><span class="num">' + cop(c.total) + '</span></div><div class="kv"><span>Mi comisión</span><span class="num">' + cop(com) + '</span></div><div class="kv"><span>Propinas</span><span class="num">' + cop(c.propinas) + '</span></div></div>';
}
function bvList() {
  const vs = VENTAS.filter((v) => v.b === YO).slice().sort((a, z) => z.t - a.t || z.ticket - a.ticket);
  return (vs.map((v) => ventaRow(v, 'barbero')).join('') || '<p class="muted">Aún no registras ventas hoy.</p>') + '<p class="muted" style="font-size:12px;margin-top:8px">¿Te equivocaste en una venta? Pídele al administrador que la anule; tú no puedes borrarla.</p>';
}
ROUTES['/barbero/ventas'] = {
  title: 'Mis ventas',
  init(q) {
    VF.init('barbero');
    if (q.cita !== undefined) { const c = AGENDA.find((x) => String(x.id) === q.cita && x.b === YO); if (c && porAtender(c)) { let i = VF.s.citas.indexOf(c); if (i < 0) { VF.s.citas.unshift(c); i = 0; } VF.cargar(i); } }
    VF.onSave = () => refresh('bv-tile', 'bv-list');
  },
  view() {
    const content = ph(cap(fLarga(HOY)), 'Mis ventas') + '<div class="vgrid"><div>' + VF.view() + '</div><aside class="stack-v" style="gap:18px" aria-label="Mi resumen del día">' +
      '<section class="card card-pad tile-marble" aria-label="Lo que llevas hoy">' + part('bv-tile', bvTile) + '</section>' +
      '<section class="card card-pad" aria-labelledby="t-mias"><div class="card-head"><h2 class="card-title" id="t-mias">Mis ventas de hoy</h2></div>' + part('bv-list', bvList) + '</section></aside></div>';
    return panel({ rol: 'barbero', active: 'ventas', content });
  },
  act: VF.act, inp: VF.inp, chg: VF.chg
};

/* ---------- Mi reporte ---------- */
const BRS = { modo: 'mes', mes: '', desde: '', hasta: '' };
ROUTES['/barbero/reportes'] = {
  title: 'Mi reporte',
  init() { rpInitDates(BRS); },
  view() {
    const after = '<div class="field"><span>Barbero</span><span class="locked">Santiago Ríos (tú)' + I('lock', 15) + '</span></div>';
    const content = ph('Ventas, servicios y liquidación', 'Mi reporte') +
      '<section class="card" aria-label="Filtros del reporte">' + part('br-filters', () => '<div class="filters">' + periodoCtl(BRS, after) + '<div class="push"><button type="button" class="btn btn-gold btn-caps" data-act="rp-pdf">' + I('download', 18) + 'Descargar PDF</button></div></div>') + '</section>' +
      '<p class="muted" style="font-size:12px;margin-top:-8px">Solo ves tus propias ventas y tu liquidación. Los reportes de la barbería y de otros barberos son del administrador.</p>' +
      '<div id="report-preview">' + part('br-preview', () => RP.detallado(rpPeriodo(BRS), YO, 'barbero')) + '</div>';
    return panel({ rol: 'barbero', active: 'reportes', content });
  },
  act: RP_ACT(BRS, () => refresh('br-filters', 'br-preview')),
  chg: RP_CHG(BRS, () => refresh('br-filters', 'br-preview'))
};

/* ---------- Arranque ---------- */
render();

</script>
</body>
</html>
